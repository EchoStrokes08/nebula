name: Instaladores
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/validate-release.cjs
      - run: npm run check
      - run: npm run build:desktop
      - if: runner.os == 'Linux'
        run: ./node_modules/.bin/electron-builder --linux AppImage --config.electronDist=node_modules/electron/dist --publish never
      # El .deb exige un mantenedor con email (variable DEB_MAINTAINER, p. ej. «Nombre <correo>»).
      - if: runner.os == 'Linux' && vars.DEB_MAINTAINER != ''
        run: ./node_modules/.bin/electron-builder --linux deb --config.electronDist=node_modules/electron/dist --config.linux.maintainer="${{ vars.DEB_MAINTAINER }}" --publish never
      # Instalador web: el .exe pequeño descarga el paquete de la release v<versión> (ver el script).
      - if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/nsis-web/*
