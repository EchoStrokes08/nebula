<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Volviendo a Nebula</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0815; color: #EDE8F7; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { text-align: center; padding: 24px 16px; max-width: 420px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: #B4AACB; margin: 0 0 20px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #8055E8; color: #fff; text-decoration: none; font-weight: 600; }
  a.btn[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="t">Volviendo a Nebula…</h1>
  <p id="m">Si no pasa nada en unos segundos, toca el botón.</p>
  <a id="b" class="btn" href="/nebula/" hidden>Volver a Nebula</a>
</main>
<script>
  // Página puente del permiso de Google Calendar: Google vuelve aquí con el token en el fragmento
  // (#access_token=…) y esta página lo reenvía a la app que lo pidió, según `state`. Solo hay
  // tres destinos fijos, así que no puede usarse para enviar el token a otro sitio.
  (function () {
    var p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    history.replaceState(null, '', location.pathname);
    var m = /^([wad])\.[A-Za-z0-9_-]{16,64}$/.exec(p.get('state') || '');
    var btn = document.getElementById('b');
    if (!m) {
      document.getElementById('t').textContent = 'Enlace no válido';
      document.getElementById('m').textContent = 'Vuelve a Nebula e inténtalo otra vez desde la Agenda.';
      btn.hidden = false;
      return;
    }
    var out = new URLSearchParams();
    ['access_token', 'expires_in', 'scope', 'state', 'error'].forEach(function (k) { if (p.get(k)) out.set(k, p.get(k)); });
    var targets = {
      w: location.origin + '/nebula/google-calendar',
      a: 'nebula://google-calendar',
      d: 'http://127.0.0.1:47913/auth/callback',
    };
    var url = targets[m[1]] + '?' + out.toString();
    btn.href = url;
    location.replace(url);
    setTimeout(function () { btn.hidden = false; }, 1500);
  })();
</script>
</body>
</html>
